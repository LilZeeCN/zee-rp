name: Windows tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install pillow numpy jsonschema
      # npm test exercises MCP file input through compilation without an Axure template.
      - run: npm test
      - run: npm run test:layers
      - run: npm run test:studio-parity
      - run: npm run test:language
      - run: npm run test:source-contract
