name: Desktop tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install pillow numpy jsonschema
      # npm test exercises MCP file input through compilation without an Axure template.
      - run: npm test
      - run: npm run test:bin
      - run: npm run test:protocol
        timeout-minutes: 6
      - run: node --test test/studio-startup-normalization-check.mjs
      - run: npm run test:layers
      - run: npm run test:studio-parity
      - run: npm run test:language
      - run: npm run test:source-contract
