name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/rp-inspector/index.html'
      - 'scripts/rp-browser-core.mjs'
      - 'tools/sync-inspector.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify embedded browser core sync
        run: node tools/sync-inspector.mjs --check
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp tools/rp-inspector/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
